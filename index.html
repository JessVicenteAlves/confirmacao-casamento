<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Confirmação — Jéssica & Victor</title>
<style>
body{margin:0;background:#f8f6ef;color:#203d2b;font-family:Georgia,serif}
main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:min(600px,100%);background:#fffdf8;border:1px solid #d8dfd2;border-radius:26px;padding:40px 28px;box-shadow:0 20px 60px #273d291f;text-align:center}
.kicker{font:600 11px Arial;color:#6e866c;text-transform:uppercase;letter-spacing:.18em}
h1{color:#31583f;font-size:32px;font-weight:500;margin:18px 0 10px}
p{font:15px/1.55 Arial;color:#5b6d5a}
label{display:block;text-align:left;font:600 13px Arial;color:#31583f;margin:26px 0 8px}
input{width:100%;padding:15px;box-sizing:border-box;border:1px solid #bdc9b5;border-radius:13px;background:#fffdf8;font:16px Arial}
button{width:100%;margin-top:14px;padding:15px;border:0;border-radius:13px;background:#31583f;color:white;font:600 15px Arial;cursor:pointer}
.panel{margin-top:18px;padding:18px;border-radius:16px;text-align:left;font:14px/1.5 Arial}
.ok{background:#e7ece0}.bad{background:#f2f0e5}.result{border-top:1px solid #31583f22;padding-top:12px;margin-top:12px}
.hidden{display:none}.small{font:italic 12px Arial;color:#718071;margin-top:18px}
</style></head>
<body><main><section class="card">
<div class="kicker">Com carinho</div>
<h1>Seu convite espera por você</h1>
<p>Digite seu nome para encontrar o convite preparado para este momento tão especial.</p>
<form id="f"><label for="q">Nome do convidado</label><input id="q" placeholder="Digite seu nome aqui" autocomplete="name"><button>Buscar convite</button></form>
<div id="ok" class="panel ok hidden"></div>
<div id="bad" class="panel bad hidden">Não encontramos esse nome. Tente uma parte do nome ou confira a ortografia.</div>
<div class="small">Você pode buscar pelo primeiro nome, sobrenome ou nome completo.</div>
</section></main>
<script>
const groups=[{"code": "CAS-9ZE3AP", "names": ["Zélia Galdino"]}, {"code": "CAS-38WCLG", "names": ["Elaine Fernandes", "José Augusto Fernandes", "Maria dos Santos"]}, {"code": "CAS-LVA7PE", "names": ["Victor da Silva", "Jéssica Vicente"]}, {"code": "CAS-AFHQXU", "names": ["Angelina Galdino"]}, {"code": "CAS-4YM7YB", "names": ["Alexandre Fernandes", "Márcia Fernandes"]}, {"code": "CAS-36GCMH", "names": ["Andréia da Silva", "Benancy da Silva", "Danielly da Silva", "Danyllo de Santana", "Isabelly da Silva"]}, {"code": "CAS-878H59", "names": ["Allessandro Sobrinho", "Vanderleia Coelho", "Vitória"]}, {"code": "CAS-SQ3EQB", "names": ["João Maurício Araújo", "Ana Luísa Gomes"]}, {"code": "CAS-4Q3WPP", "names": ["Keli Albino", "Gilcimar Silva"]}, {"code": "CAS-VP43WD", "names": ["Edilza Franco", "Daniel Santana", "Gustavo Franco", "Hugo Franco"]}, {"code": "CAS-LE4ZCK", "names": ["Kauã Izidoro"]}, {"code": "CAS-2RUX2Z", "names": ["Mariene Gomes", "Lenon Falcão"]}, {"code": "CAS-RHKUKX", "names": ["Mariana Mendes", "Benício Pereira", "Daniel Pereira", "Manuela Pereira"]}, {"code": "CAS-9L6U8H", "names": ["Lucas Araújo"]}, {"code": "CAS-U9AX6Z", "names": ["Thiago Lino"]}, {"code": "CAS-5MTMGW", "names": ["Pedro André", "Júlia Laura dos Santos"]}, {"code": "CAS-8NGBA2", "names": ["Leonardo Aguiar", "Levi Aguiar", "Marcela Pimentel"]}, {"code": "CAS-CSJ5BZ", "names": ["Joana Vasconcelos", "Arthur Klinger Vasconcelos", "Klinger Guimarães", "Pollyana Vasconcelos"]}, {"code": "CAS-KBPY3M", "names": ["Erika Maria Bernardo", "Maria Júlia Bernardo"]}, {"code": "CAS-B8MLXG", "names": ["Danielle Gomes", "Laryssa Simões", "Letycia Simões", "Vitorio Simões"]}, {"code": "CAS-MQVH6Z", "names": ["Jaqueline Mendes", "Ana Clara Barroso", "Cecília Barroso", "Laura Barroso"]}, {"code": "CAS-XZLC9W", "names": ["Isabelle Ribeiro", "Matheus Nogueira"]}, {"code": "CAS-UZDAHH", "names": ["Letícia Ribeiro", "Caio de Andrade"]}, {"code": "CAS-L7BZ7T", "names": ["Vitória Leal", "Alexsandro Aguiar"]}, {"code": "CAS-UQA9VF", "names": ["Aldair Aguiar", "Nelma Maria da Silva", "Priscila Alves", "Raphael Aguiar"]}, {"code": "CAS-BQVQWL", "names": ["Pedro Brito"]}, {"code": "CAS-YL5P5S", "names": ["Raquel Oliveira", "Bernardo Patrocínio", "Thiago Patrocínio"]}, {"code": "CAS-BRVUTZ", "names": ["Marcelo Souza", "João", "Marcelo Júnior", "Micaela", "Shirleila Vieira"]}, {"code": "CAS-F5MGYY", "names": ["Roosevelt Machado", "Lucas Machado", "Rosana Amorim"]}, {"code": "CAS-UA7TPT", "names": ["Allan Allen", "Oneide Cristina Dias"]}, {"code": "CAS-N7V65P", "names": ["Pedro Sousa", "Esther Maurício"]}, {"code": "CAS-RR7EAE", "names": ["Vanessa Fernandes", "Arthur Miguel Reis"]}, {"code": "CAS-JU3FEX", "names": ["Rayla Russo"]}, {"code": "CAS-92VDVD", "names": ["Bruna Praun"]}, {"code": "CAS-6BFGCH", "names": ["Lara Paulino", "Paulo Cesar"]}, {"code": "CAS-XL7HR2", "names": ["Karol Paulino", "Henrique Gomes", "Isis Paulino", "Pedro Henrique Paulino"]}, {"code": "CAS-H3HBHL", "names": ["Heloísa Vicente", "Sueli Garcia", "Wellington Garcia"]}, {"code": "CAS-GNLEYZ", "names": ["Lúcia Regina Vicente", "Larissa Vicente"]}, {"code": "CAS-39YV2Z", "names": ["Rita de Cássia Vicente", "Deleir Alves"]}, {"code": "CAS-HXJJF5", "names": ["Laís Vicente", "Bruno Gomes"]}, {"code": "CAS-D9XSGF", "names": ["Victória Ribeiro", "Jefferson Lopes"]}, {"code": "CAS-RANTKK", "names": ["Ellen Rodrigues", "Leonardo Ribeiro"]}, {"code": "CAS-6T7KHV", "names": ["Luciana Fernandes", "Raimundo Galdino"]}, {"code": "CAS-6N35PK", "names": ["Andressa Marcelly Souza", "Helena Ribeiro", "Willian Ribeiro"]}, {"code": "CAS-E96R3T", "names": ["Ana Paula Ribeiro", "Anderson Silva", "Aurora Silva"]}];
const base="https://convites-online.com/invite/cmrcmt9z90003js04ca5nvl8b/";
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
const f=document.getElementById("f"),q=document.getElementById("q"),ok=document.getElementById("ok"),bad=document.getElementById("bad");
f.onsubmit=e=>{
 e.preventDefault(); ok.classList.add("hidden"); bad.classList.add("hidden");
 const x=norm(q.value); if(!x){q.focus();return;}
 const m=groups.filter(g=>g.names.some(n=>norm(n).includes(x)));
 if(!m.length){bad.classList.remove("hidden");return;}
 ok.innerHTML="<strong>Convite encontrado!</strong>";
 m.forEach(g=>{
   const d=document.createElement("div"); d.className="result";
   d.innerHTML="<strong>"+g.names[0]+"</strong>";
   const b=document.createElement("button"); b.textContent="Acessar meu convite";
   b.onclick=()=>location.href=base+g.code;
   d.appendChild(b); ok.appendChild(d);
 });
 ok.classList.remove("hidden");
};
</script></body></html>
